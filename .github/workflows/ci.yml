name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FIXGRAPH_MODE: test
      FIXGRAPH_ENV: test
      FIXGRAPH_LLM_PROVIDER: mock
      DEEPLINKS_PATH: tests/fixtures/challenge_assets/deeplinks.json
      QUERIES_PATH: tests/fixtures/challenge_assets/queries.json
      SIIS_PATH: tests/fixtures/challenge_assets/siis_responses.json

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Lint with ruff
      run: |
        ruff check .

    - name: Test with pytest
      run: |
        pytest -q

    - name: Build Docker image (smoke test)
      run: |
        docker build -t fixgraph:ci .
