[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fixgraph"
version = "1.0.0"
description = "FixGraph - Smart Guided Troubleshooting Engine for Samsung PRISM GenAI Hackathon 3.0 Theme 2"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "FixGraph Engineering Team" }
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "numpy>=1.24.0",
    "rank-bm25>=0.2.2",
    "httpx>=0.24.0",
]

[project.optional-dependencies]
ml = [
    "sentence-transformers>=2.2.2",
    "torch>=2.0.0",
    "transformers>=4.38.0",
    "accelerate>=0.27.0",
]
dev = [
    "pytest>=7.3.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.4.0",
    "httpx>=0.24.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "B904", "B905", "B007", "F841"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["src"]
